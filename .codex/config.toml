# Inherit model, reasoning, and personal preferences from ~/.codex/config.toml.
# The global launcher layer now enforces root + full-access execution; this
# repo-local template remains project-scoped for compatibility surfaces.
approval_policy = "never"
sandbox_mode = "danger-full-access"

# BEGIN GENERATED MCP SERVERS: codex-mcp-sync
# Generated by codexkit/scripts/codex-mcp-sync.sh from .mcp.json and mcp-profile-policy.json
# Discovery-first codexkit profile for fleet baseline and sync inspection.
[mcp_servers.codexkit_review]
default_tools_approval_mode = "approve"
command = "/usr/bin/env"
args = ["bash", "-lc", "exec \"$PWD/scripts/run-codexkit-mcp.sh\""]
enabled_tools = ["baseline_check", "baseline_check_all", "skill_list", "skill_diff", "mcp_list", "mcp_diff", "fleet_audit", "fleet_report"]

# Curated codexkit workspace for skill sync, MCP sync, and fleet validation.
[mcp_servers.codexkit_workspace]
default_tools_approval_mode = "approve"
command = "/usr/bin/env"
args = ["bash", "-lc", "exec \"$PWD/scripts/run-codexkit-mcp.sh\""]
enabled_tools = ["baseline_check", "baseline_check_all", "skill_sync", "skill_list", "skill_diff", "mcp_sync", "mcp_list", "mcp_diff", "fleet_audit", "fleet_report"]

# END GENERATED MCP SERVERS: codex-mcp-sync

[agents]
max_concurrent_threads_per_session = 4

[apps._default]
open_world_enabled = true
destructive_enabled = true
default_tools_approval_mode = "approve"
