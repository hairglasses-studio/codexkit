name: Codex Baseline Guard

# Public fork PRs are not run on self-hosted runners. Push and manual dispatch
# keep the public baseline evidence current.
on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  baseline:
    name: Baseline check
    runs-on:
      group: Internal-Arch
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: Validate repo baseline
        run: GOWORK=off go run ./cmd/codexkit baseline check .
