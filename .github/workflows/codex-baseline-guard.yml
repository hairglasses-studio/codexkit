name: Codex Baseline Guard

# Automatic triggers are paused while this public org repo is constrained to the
# Internal-Arch runner path. Use manual dispatch after runner access is healthy.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  baseline:
    name: Baseline check
    runs-on:
      group: Internal-Arch
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: Validate repo baseline
        run: GOWORK=off go run ./cmd/codexkit baseline check .
