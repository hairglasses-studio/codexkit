name: Perf

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  go-bench:
    runs-on:
      group: Internal-Arch
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - name: Benchmark Go package path
        run: |
          set -euo pipefail
          go test ./... -run '^$'
          go test ./... -run '^$' -bench . -benchmem -benchtime=1s
